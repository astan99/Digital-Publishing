<h1 class="Base head_one">Icarus in Love</h1>
<h3 class="Base head_one Author"><em>David Jones</em></h3>
<p class="Base Body stanza">I loved you as </p>
<p class="Base Body stanza p2">Icarus loved</p>
<p class="Base Body stanza p2">The sun -</p>
<p class="Base Body stanza p2">Too close,</p>
<p class="Base Body stanza p2">Too much.</p>
