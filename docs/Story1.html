<h1 class="Base head_one">The Red Wheel Barrow</h1>
<H3 class="Base head_one Author"><em>William Carlos Williams</em></H3>
<p class="Base Body p2">so much depends</p>
<p class="Base Body stanza">upon </p>
<p class="Base Body p3">a red wheel </p>
<p class="Base Body stanza">barrow</p>
<p class="Base Body p3">glazed with rain</p>
<p class="Base Body stanza">water</p>
<p class="Base Body p3">beside the white</p>
<p class="Base Body stanza">chickens</p>
